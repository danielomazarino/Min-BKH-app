<!doctype html>
<html lang="sv-SE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Min BKH-app" />
    <!-- Relative, not "/icons/...". The app is deployed under a GitHub Pages
         PROJECT sub-path, so an origin-absolute path 404s on install. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="description" content="Supporterapp för BK Häckens herrlag — nästa match, varningar, nyheter och tidigare spelare." />
    <title>Min BKH-app</title>
    <!-- Privacy-first analytics (Umami Cloud, free Hobby tier): no cookies, no
         personal data, so no consent banner is needed.
         In <head> because the installed PWA loads this same document — that
         launch is a real visit and must be counted.
         `data-domains` is deliberate: the tracker ignores every host except
         production, so `npm run dev`, `npm run preview` and the Playwright
         suite cannot pollute the production numbers. To view local traffic,
         add localhost to that list temporarily.
         Changing the id means creating a new website in cloud.umami.is. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="5574b261-86be-4d1f-852d-4bce3e23a141"
      data-domains="danielomazarino.github.io"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
