name: Former-player research probe (TEMPORARY)

# TEMPORARY, to be deleted. Runs the bounded former-player research probe
# with the GEMINI_API_KEY secret, because the key is not available locally.
# Writes nothing: it only prints the structured research result so every
# claim can be checked by hand.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp-research-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Research a small bounded set of former players
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx pipeline/src/formerPlayerResearchProbe.ts
