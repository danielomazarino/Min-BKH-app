name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate generated data
        run: npm run pipeline:validate

      - name: Secret leak check (frontend + data)
        run: |
          ! grep -rE "API_FOOTBALL_KEY|apisports-key" dist/ public/data/ 2>/dev/null
          ! grep -rE "fc-[a-zA-Z0-9]{20,}" dist/ public/data/ 2>/dev/null
          ! grep -rE "GEMINI_API_KEY|AIza[0-9A-Za-z_-]{30,}" dist/ public/data/ 2>/dev/null
          # OpenRouter keys are prefixed sk-or-v1-. They are only ever injected
          # as workflow secrets into the openrouter-* measurement workflows, so
          # finding one in a build artifact or committed data would be a real
          # leak, not a false positive.
          ! grep -rE "OPENROUTER_API_KEY|sk-or-v1-[A-Za-z0-9]{20,}" dist/ public/data/ 2>/dev/null

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E + accessibility tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: test-results/screens/
          retention-days: 7
