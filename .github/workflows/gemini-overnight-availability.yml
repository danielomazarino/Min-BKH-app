name: Gemini availability (11 samples, alternating probe)

# Measures WHEN the FREE TIER is usable, and — separately — WHEN the model is
# merely non-overloaded. Those are two different questions that this file
# previously conflated into one.
#
# WHY THE PROBE CHANGED ON 2026-10-01
#   A 429 body captured in run 36813438657 finally identified the real ceiling:
#
#     "Quota exceeded for metric:
#      generativelanguage.googleapis.com/generate_content_free_tier_requests,
#      limit: 20, model: gemini-3.8-flash"
#     "status": "RESOURCE_EXHAUSTED"
#
#   So the key is FREE TIER, hard-capped at 20 generation requests per UTC day.
#   That reframes everything:
#
#     * A 429 is a QUOTA answer. It means the daily allowance is spent. It is
#       clean, unambiguous evidence, and it needs no further requests to confirm.
#     * A 503 is a CAPACITY answer. It means the model is overloaded. It is not
#       proof of quota exhaustion, and it is not proof of health either.
#
#   The old "5 samples x 2 requests" design spent 10 requests a night against a
#   20/day ceiling — half the daily budget to re-learn, every night, something
#   the previous night's log had already said. And it bundled BOTH probes into
#   every run, so a single 429 from the chat probe could not be attributed to
#   quota-as-opposed-to-capacity.
#
# WHAT THIS DOES INSTEAD — one probe per hour, alternating
#   PROBE=1  availability-sample.sh  "reply with the single word: ok"
#                                -> the cheapest possible reachability ping
#   PROBE=2  gemini-chat-probe.sh   a real structured Swedish answer
#                                -> does a USABLE reply exist at all
#
#   These answer different questions, so they are no longer bundled. Alternating
#   means a 429 on an availability hour is attributable to availability, and a
#   429 on a chat hour is attributable to the chat probe. Pairing them in one run
#   destroyed that attribution — which is precisely why 04:05Z on 2026-10-01
#   produced a 200 and a 429 0.2 s apart and looked self-contradictory.
#
#   It also means a single request per hour, so the nightly cost drops from 10
#   to 24 requests/day only if the run were hourly AND doubled — it is not. One
#   request per firing, and the two probes interleave, so each individual probe
#   is sampled twice as often as before for the same total spend.
#
# HOW PROBE NUMBER IS DETERMINED
#   GitHub Actions cron is ALWAYS UTC. There is no local-time cron, and no
#   "every 2nd run" primitive. So parity is computed from the UTC hour, which is
#   exactly the clock the quota window is aligned to anyway.
#
#     (HOUR / 2) % 2 == 1  ->  PROBE 1 (availability)
#     (HOUR / 2) % 2 == 0  ->  PROBE 2 (chat question)
#
#   The division by 2 is load-bearing. The schedule fires on ODD hours only
#   (03,05,...,23), so plain `HOUR % 2` would be 1 for every single firing and
#   would select probe 1 forever — silently disabling the chat probe, which is
#   the only probe that has ever produced information worth having. Dividing by
#   2 steps once per firing and alternates correctly.
#
#   Sequence: 03->1, 05->2, 07->1, 09->2, ... 23->1. Eleven firings, six of
#   probe 1 and five of probe 2 — the split is uneven by one because the window
#   starts on an odd hour, and that is a property of the cron, not a bug.
#
#   The parity is computed INSIDE the job from `date -u +%H`, not encoded in two
#   separate cron entries. Two crons would double-count every run against the
#   `concurrency` group and make a skipped or delayed run silently shift the
#   alternation, which is exactly the silent-mode-drift class of bug this repo
#   already has one of.
#
# COST: exactly 1 generation request per firing, never retried, 11/day
# (03:00, 05:00 ... 23:00 UTC). The free tier allows 20/day, so this fits
# UNDER the ceiling with headroom — which is deliberate: a run that saturates
# the budget cannot distinguish "the tier is exhausted" from "the service is
# unhealthy", because both look like failure. The earlier hourly design spent
# 24/day, which guaranteed 429s for the last four hours and told us nothing.
# The 1-request-per-firing shape is what makes a 429 attributable.
#
# NOTE ON "12 SAMPLES" IN THE NAME — it is 11 firings, and the name is
# deliberately slightly off rather than misleading. 03:00 every 2 hours through
# 23:00 is 11 firings (03,05,07,09,11,13,15,17,19,21,23); a 12th would fall at
# 01:00 on the NEXT day, which is outside the window and would collide with the
# production nightly at 03:30. The count was not rounded up to reach a rounder
# number, and the budget maths above uses 11 because that is what the cron does.
#
# STOP CONDITION — REMOVE THIS SCHEDULE ON SUNDAY 2026-10-05
#   The run is a bounded experiment, not a permanent monitor. It must be
#   disabled after 2026-10-05 (Sunday). Left in place it would keep spending
#   requests indefinitely and, combined with the production nightly, would
#   eventually crowd out the very measurement it exists to protect.
#
#   This workflow commits nothing, so the schedule CANNOT remove itself. A human
#   must delete the `schedule:` block (or the whole file) on Sunday.
#
# RECORDING A RESULT
#   This workflow deliberately writes NO summary and commits NOTHING. A nightly
#   commit would trigger deploy.yml on data that did not change. The evidence
#   is the run log; `docs/ENHANCEMENTS.md` is updated by a human afterwards.

# ============================================================================
# SCHEDULE IS INTENTIONALLY DISABLED — as of 2026-10-04.
#
# WHY IT WAS STOPPED
#   The 11-firings-a-day experiment produced its answer and then kept spending.
#   Measured over 35 runs (2026-09-30 -> 2026-10-04), at 1 request per firing:
#
#     availability ping (144 B) : 10 / 21 succeeded  (48%)
#     chat question  (586 B)    :  0 / 15 succeeded  ( 0%)
#
#   Gemini is therefore NOT down — it is reachable roughly half the time. But
#   the probe that resembles real work has NEVER succeeded, so the experiment
#   could not answer the question it existed to answer, and 11 requests/day
#   cannot answer it either. That is a reason to stop, not to keep sampling.
#
#   The deadline this file set for itself ("remove on Sunday 2026-10-05") was
#   met one day early. Nothing is lost: the schedule is one uncommented line.
#
# NOTHING IS DELETED
#   Both probe scripts, this workflow, and the repository secret all remain.
#   The scripts still work by hand:
#     gh workflow run gemini-overnight-availability.yml
#   which runs exactly ONE request (the parity gate picks the probe). That is
#   the supported way to take a single measurement, and it is how the decisive
#   experiment in docs/ENHANCEMENTS.md should be run.
#
# TO RESTORE THE SCHEDULE (only if you go paid tier, or want another free try)
#   1. Get a key that can actually generate:
#        - PAID:  put a billing-enabled key in as GEMINI_API_KEY. Free tier is
#          hard-capped at 20 generateContent requests per UTC day (measured from
#          a real 429 body, run 36813438657) — that cap is the binding constraint,
#          not capacity.
#        - FREE:  keep the current key, accept the 20/day cap, and expect the
#          ~48% availability measured above.
#   2. Uncomment the cron block below.
#   3. Optionally widen the budget: 11 requests/day sits under the 20/day
#      ceiling with headroom, deliberately. Do NOT raise it above 20 — a run
#      that saturates the budget cannot tell "tier exhausted" from "service
#      unhealthy", because both look like failure. See B-004 in
#      docs/ENHANCEMENTS.md.
#   4. Re-run the decisive experiment FIRST, before trusting any schedule:
#      run the chat probe's exact payload at a PING hour (07/15/19 UTC). A 200
#      means the chat failures were time-of-day; a 503 means request SHAPE
#      (prime suspect: responseMimeType application/json). See
#      .github/scripts/gemini-chat-probe.sh for the recorded 0/15 result.
#
#   See docs/ENHANCEMENTS.md (B-004, "Gemini capacity") for the full evidence.
# ============================================================================

on:
  # schedule:
  #   - cron: "0 3-23/2 * * *"   # RESTORE: 03:00-23:00 UTC every 2h, 1 req each
  workflow_dispatch:

concurrency:
  group: gemini-overnight-availability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No `npm ci`: both probes are single curl calls against the REST endpoint
      # and need no repository dependencies. Installing them would only add
      # minutes of failure surface to a measurement run.
      #
      # The parity gate runs FIRST so the chosen probe is announced before any
      # request is spent. If the selection logic is ever wrong, the log says
      # which probe was chosen and why, before the evidence is destroyed.
      - name: Select probe by UTC hour parity
        id: pick
        run: |
          HOUR=$(date -u +%-H)
          # Parity must be computed over the FIRING SEQUENCE, not over raw hours.
          # The schedule fires on odd hours only (03,05,...,23), and every one of
          # those is odd — so `HOUR % 2` is 1 for all of them and would select
          # probe 1 forever, silently disabling the chat probe entirely.
          # `(HOUR / 2) % 2` steps once per firing instead, which alternates.
          PARITY=$(( (HOUR / 2) % 2 ))
          if [ "$PARITY" -eq 1 ]; then
            PROBE=1; SCRIPT=gemini-availability-sample.sh
            DESC="availability ping (reply: ok)"
          else
            PROBE=2; SCRIPT=gemini-chat-probe.sh
            DESC="chat question (structured Swedish answer)"
          fi
          echo "utc_hour   =$HOUR"
          echo "parity     =$PARITY (computed as (HOUR/2)%2 — the schedule fires"
          echo "             on odd hours only, so HOUR%2 would never alternate)"
          echo "probe      =$PROBE  $DESC"
          echo "script     =$SCRIPT"
          echo "started_utc=$(date -u +%FT%TZ)"
          {
            echo "probe=$PROBE"
            echo "script=$SCRIPT"
          } >> "$GITHUB_OUTPUT"

      - name: Run the selected probe (ONE request, never retried)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: bash ".github/scripts/${{ steps.pick.outputs.script }}"

      # Machine-readable summary. `if: always()` matters: both probe scripts
      # exit 0 on an HTTP error by design, so a RED run would mean the SCRIPT
      # broke, not that Gemini refused. The run must stay green for the
      # 429-vs-503 distinction in the log to remain the signal.
      - name: Emit machine-readable outcome
        if: always()
        env:
          PROBE: ${{ steps.pick.outputs.probe }}
          SCRIPT: ${{ steps.pick.outputs.script }}
        run: |
          {
            echo "### gemini-hourly"
            echo "utc_hour=$(date -u +%-H)"
            echo "probe=$PROBE"
            echo "script=$SCRIPT"
            echo "note: HTTP code and error body are in the log, not here."
          } >> "$GITHUB_STEP_SUMMARY"
