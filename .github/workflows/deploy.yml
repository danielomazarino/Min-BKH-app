name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Commit to build and deploy. Set by data-update.yml so the nightly
          deploy publishes exactly the data commit that was just pushed,
          instead of whatever main resolves to at checkout time. Leave empty
          for a manual dispatch (builds current main).
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref to build
        id: ref
        env:
          REQUESTED: ${{ inputs.commit }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "Building pinned data commit: $REQUESTED"
            echo "ref=$REQUESTED" >> "$GITHUB_OUTPUT"
          else
            echo "No commit input — building current main HEAD."
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
