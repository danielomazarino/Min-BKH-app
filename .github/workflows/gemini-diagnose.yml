name: Gemini diagnose (throwaway)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: List models (proves the key authenticates)
        run: |
          code=$(curl -s -o /tmp/models.json -w "%{http_code}" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models")
          echo "listModels HTTP=$code"
          head -c 1500 /tmp/models.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Minimal generateContent probe per candidate model
        run: |
          for m in gemini-3.8-flash gemini-3.7-flash gemini-flash-latest gemini-2.5-flash; do
            code=$(curl -s -o /tmp/g.json -w "%{http_code}" -X POST \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"role":"user","parts":[{"text":"svara med ordet ok"}]}]}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent")
            echo "=== $m HTTP=$code"
            head -c 350 /tmp/g.json
            echo
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
