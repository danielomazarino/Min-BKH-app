name: OpenRouter semantic evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openrouter-semantic-eval
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: One request, then report
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Model resolved at run time by openrouterModel.ts (the old pinned
          # qwen/qwen3.8-27b:free was delisted 2026-10-06). Set OPENROUTER_MODEL
          # here to force a specific :free model — a delisted pin now fails
          # BEFORE the request instead of burning it on a 404.
          EVAL_DUMP_RAW: "1"
        run: npm run --silent openrouter:eval
